<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Shine | Contacto</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><img src="logo.png" alt="Golden Shine Logo"></a>
      <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
      <div class="hamburger"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h2>Contáctanos</h2>
      <p style="text-align:center; margin-bottom:30px;">¿Te interesa alguna pieza o quieres conocer nuestras opciones de financiamiento? Escríbenos.</p>
      
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Teléfono (opcional)</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" placeholder="Cuéntanos qué pieza te interesa o tus dudas sobre pagos..." required></textarea>
        </div>
        <button type="submit" class="btn-gold" style="width:100%; border:none; cursor:pointer;">Enviar mensaje</button>
      </form>
      
      <div style="text-align:center; margin-top:40px;">
        <p><strong>Golden Shine Joyería</strong></p>
        <p>Respuesta en menos de 24 horas</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Golden Shine Joyería. Todos los derechos reservados.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
